<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Multi-Image Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-wrapper { display: flex; gap: 20px; align-items: flex-start; }
        .card { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .controls-box { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .upload-btn { background: #6c63ff; color: white; padding: 12px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="card">
            <canvas id="c" width="512" height="512" style="border:1px solid #ccc"></canvas>
        </div>

        <div class="card controls-box">
            <h1>MCTweaks.club</h1>
            <input type="file" id="fileInput" accept="image/*" class="upload-btn">
            <p style="font-size: 12px; color: #666;">Puedes subir varias imágenes. Selecciónalas para moverlas o usar el slider para escalar la seleccionada.</p>
            <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1">
            <button id="downloadBtn" class="upload-btn">Descargar Resultado</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('c');
        let template = null;

        // Carga el template
        fabric.Image.fromURL('inventory.png', function(img) {
            template = img;
            template.set({ selectable: false, evented: false, crossOrigin: 'anonymous', originX: 'center', originY: 'center', left: 256, top: 256 });
            canvas.add(template);
            canvas.requestRenderAll();
        }, { crossOrigin: 'anonymous' });

        // Añadir múltiples imágenes
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    fabric.Image.fromURL(event.target.result, function(img) {
                        img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                        img.scaleToWidth(200); // Tamaño inicial más pequeño para que no ocupen todo
                        canvas.add(img);
                        
                        // Mantenemos el template arriba
                        if(template) template.bringToFront();
                        canvas.setActiveObject(img);
                        canvas.requestRenderAll();
                    });
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // El slider ahora afecta a la imagen seleccionada actualmente
        document.getElementById('zoomSlider').addEventListener('input', function(e) {
            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj !== template) {
                activeObj.scale(parseFloat(e.target.value));
                canvas.requestRenderAll();
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            canvas.discardActiveObject();
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 });
            const link = document.createElement('a');
            link.download = 'mctweaks_multi_overlay.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
