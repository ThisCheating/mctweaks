<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Generador Pro 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #222; display: flex; justify-content: center; padding: 20px; color: white; }
        .app-wrapper { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        
        /* Contenedor 3D */
        .scene { width: 512px; height: 512px; perspective: 1000px; }
        .card-3d { 
            width: 100%; height: 100%; position: relative;
            transition: transform 0.8s ease; transform-style: preserve-3d;
            cursor: grab;
        }
        .card-3d.active { transform: rotateY(-20deg) rotateX(10deg); }
        
        /* Capa de "anchura" (grosor) */
        .depth-layer { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            transform: translateZ(-20px); border-radius: 12px;
        }

        #c { background: transparent; border-radius: 8px; }
        .controls { width: 380px; background: #fff; color: #333; padding: 20px; border-radius: 15px; }
        .upload-btn { background: #6c63ff; color: white; padding: 10px; border-radius: 6px; border: none; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="scene">
        <div class="card-3d" id="card3d">
            <div class="depth-layer"></div>
            <canvas id="c" width="512" height="512"></canvas>
        </div>
    </div>

    <div class="card controls">
        <h1>MCTweaks.club</h1>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Subir Imagen</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button id="readyBtn" class="upload-btn" style="background:#f39c12">Listo: Transición 3D</button>
        <button id="downloadBtn" class="upload-btn" style="background:#2ecc71; display:none;">Descargar Pack</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    let template = null;

    // Cargar Template original
    fabric.Image.fromURL('inventory.png', (img) => {
        template = img.set({ selectable: false, originX: 'center', originY: 'center', left: 256, top: 256 });
        canvas.add(template);
    }, { crossOrigin: 'anonymous' });

    // Subir imagen
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
                img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                canvas.add(img);
                img.sendToBack();
                canvas.renderAll();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    // Transición a 3D Transparente
    document.getElementById('readyBtn').onclick = () => {
        const card = document.getElementById('card3d');
        const canvasEl = document.getElementById('c');
        
        // Hacer transparente el fondo del canvas
        canvas.setBackgroundColor('transparent');
        canvas.renderAll();
        
        // Activar rotación
        card.classList.add('active');
        document.getElementById('readyBtn').style.display = "none";
        document.getElementById('downloadBtn').style.display = "block";
    };

    // Control de rotación con Mouse
    const card = document.getElementById('card3d');
    card.onmousemove = (e) => {
        if(!card.classList.contains('active')) return;
        let x = (e.clientX / window.innerWidth - 0.5) * 40;
        let y = (e.clientY / window.innerHeight - 0.5) * 40;
        card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg) translateZ(0)`;
    };
</script>
</body>
</html>
