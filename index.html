<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTweaks.club | Clean Overlay Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eee; }
        h1 { color: #6c63ff; margin-bottom: 5px; }
        p { color: #888; margin-bottom: 25px; }
        canvas { border: 2px solid #ddd; border-radius: 8px; margin: 20px 0; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .upload-btn { background: #6c63ff; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .slider-group { display: flex; align-items: center; gap: 15px; color: #555; }
        input[type="range"] { accent-color: #6c63ff; }
        button#downloadBtn { padding: 12px 30px; cursor: pointer; background: #6c63ff; color: white; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        button#downloadBtn:hover { background: #5a52d5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MCTweaks.club</h1>
        <p>Generador de Overlays para Inventarios</p>

        <canvas id="c" width="512" height="512"></canvas>

        <div class="controls">
            <input type="file" id="fileInput" accept="image/*" class="upload-btn">
            
            <div class="slider-group">
                <label>Escala:</label>
                <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1">
            </div>

            <button id="downloadBtn">Descargar Overlay (.png)</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('c');
        let userImage = null;
        let template = null;
        const templateURL = 'inventory.png'; 

        fabric.Image.fromURL(templateURL, function(img) {
            template = img;
            template.set({ selectable: false, evented: false });
            canvas.add(template);
            template.bringToFront();
            canvas.renderAll();
        }, { crossOrigin: 'anonymous' });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    fabric.Image.fromURL(event.target.result, function(img) {
                        if (userImage) canvas.remove(userImage);
                        userImage = img;
                        userImage.scaleToWidth(512);
                        userImage.center();
                        canvas.add(userImage);
                        userImage.sendToBack(); 
                        if(template) template.bringToFront();
                        canvas.renderAll();
                    });
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.getElementById('zoomSlider').addEventListener('input', function(e) {
            if (userImage) {
                userImage.scale(parseFloat(e.target.value));
                userImage.center();
                canvas.renderAll();
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 });
            const link = document.createElement('a');
            link.download = 'mi_overlay_blanco.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
</html>
