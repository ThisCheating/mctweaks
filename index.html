<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks | Editor Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #6c63ff; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; }
        header { background: var(--dark); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .app-wrapper { display: flex; gap: 40px; justify-content: center; padding: 20px; flex-wrap: wrap; }
        
        /* 3D Scene */
        .scene { width: 512px; height: 512px; perspective: 1200px; }
        .card-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.05s linear; }
        .depth-layer { position:absolute; width:100%; height:100%; background:rgba(255,255,255,0.05); transform:translateZ(-40px); border-radius:12px; opacity:0; pointer-events:none; }
        .card-3d.active .depth-layer { opacity: 1; }
        canvas { background: transparent; border-radius: 12px; cursor: grab; }
        
        /* Controles con desplegables */
        .controls { width: 400px; background: var(--dark); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        details { background: #222; margin-bottom: 10px; padding: 10px; border-radius: 5px; cursor: pointer; }
        summary { font-weight: bold; font-size: 13px; color: var(--primary); }
        .btn-main { background: var(--primary); color: white; padding: 10px; border: none; cursor: pointer; width: 100%; margin-top: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color:var(--primary)">MCTweaks</h2>
    <nav><a style="color:#ccc; margin-left:15px; text-decoration:none" href="#">Tools</a></nav>
</header>

<div class="app-wrapper">
    <div class="scene">
        <div class="card-3d" id="card3d">
            <div class="depth-layer"></div>
            <canvas id="c" width="512" height="512"></canvas>
        </div>
    </div>

    <div class="controls">
        <label>Nombre: <input type="text" id="packName" style="width:100%; background:#000; border:1px solid #444; color:white;"></label>
        
        <details>
            <summary>Sound Mixer (Seleccionar archivos)</summary>
            <input type="file" id="soundInput" multiple>
            <div id="soundList" style="font-size:10px; margin-top:5px; color:#aaa;"></div>
        </details>

        <details>
            <summary>SkyOverlay Mixer (Seleccionar archivos)</summary>
            <input type="file" id="skyInput" multiple>
            <div id="skyList" style="font-size:10px; margin-top:5px; color:#aaa;"></div>
        </details>

        <button id="readyBtn" class="btn-main">Activar Modo 3D</button>
        <button id="offBtn" class="btn-main" style="background:#e74c3c; display:none;">Desactivar 3D</button>
        <button id="downloadBtn" class="btn-main" style="background:#2ecc71;">Generar y Descargar .zip</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    canvas.selection = false;
    const card3d = document.getElementById('card3d');
    let soundFiles = [], skyFiles = [];

    // Carga de archivos y preview básico
    document.getElementById('soundInput').onchange = (e) => {
        soundFiles = e.target.files;
        document.getElementById('soundList').innerText = Array.from(soundFiles).map(f => f.name).join(', ');
    };

    document.getElementById('skyInput').onchange = (e) => {
        skyFiles = e.target.files;
        document.getElementById('skyList').innerText = Array.from(skyFiles).map(f => f.name).join(', ');
    };

    // Lógica ZIP mejorada
    document.getElementById('downloadBtn').onclick = async () => {
        const zip = new JSZip();
        // Imagen principal
        const imgData = canvas.toDataURL().split(',')[1];
        zip.folder("assets/minecraft/textures/gui/container").file("inventory.png", imgData, {base64: true});
        
        // Agregar sonidos
        const soundFolder = zip.folder("assets/minecraft/sounds");
        for(let file of soundFiles) soundFolder.file(file.name, file);
        
        // Agregar sky
        const skyFolder = zip.folder("assets/minecraft/textures/environment/sky");
        for(let file of skyFiles) skyFolder.file(file.name, file);

        const content = await zip.generateAsync({type: "blob"});
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(content); 
        a.download = (document.getElementById('packName').value || "MCTweaks") + ".zip"; 
        a.click();
    };

    // ... (rest of 3D logic maintained)
    document.getElementById('readyBtn').onclick = () => { card3d.classList.add('active'); document.getElementById('readyBtn').style.display='none'; document.getElementById('offBtn').style.display='block'; };
    document.getElementById('offBtn').onclick = () => { card3d.classList.remove('active'); document.getElementById('readyBtn').style.display='block'; document.getElementById('offBtn').style.display='none'; };
</script>
</body>
</html>
