<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Generador 3D Interactivo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; padding: 20px; }
        .app-wrapper { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        
        .scene { width: 512px; height: 512px; perspective: 1200px; }
        .card-3d { 
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out; /* Suave para el seguimiento del mouse */
            user-select: none;
        }
        
        /* Capa de grosor/anchura */
        .depth-layer { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            transform: translateZ(-30px); border-radius: 12px;
        }

        #c { background: transparent; cursor: grab; }
        #c:active { cursor: grabbing; }

        .controls { width: 350px; background: #fff; color: #333; padding: 25px; border-radius: 15px; }
        .upload-btn { background: #6c63ff; color: white; padding: 12px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-off { background: #e74c3c; }
        .btn-download { background: #2ecc71; display: none; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="scene">
        <div class="card-3d" id="card3d">
            <div class="depth-layer"></div>
            <canvas id="c" width="512" height="512"></canvas>
        </div>
    </div>

    <div class="controls">
        <h1>MCTweaks.club</h1>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Subir Imagen de Fondo</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        
        <button id="readyBtn" class="upload-btn" style="background:#f39c12">Activar Modo 3D</button>
        <button id="offBtn" class="upload-btn btn-off" style="display:none">Desactivar 3D</button>
        <button id="downloadBtn" class="upload-btn btn-download">Descargar Texture Pack</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    const card3d = document.getElementById('card3d');
    let isDragging = false;

    // Cargar Template
    fabric.Image.fromURL('inventory.png', (img) => {
        img.set({ selectable: false, originX: 'center', originY: 'center', left: 256, top: 256 });
        canvas.add(img);
    }, { crossOrigin: 'anonymous' });

    // Lógica de Rotación Presionando Click
    canvas.on('mouse:down', () => isDragging = true);
    window.addEventListener('mouseup', () => {
        isDragging = false;
        card3d.style.transform = `rotateY(0deg) rotateX(0deg)`; // Reset al soltar
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging || !card3d.classList.contains('active')) return;
        let x = (e.clientX / window.innerWidth - 0.5) * 60;
        let y = (e.clientY / window.innerHeight - 0.5) * 60;
        card3d.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    // Botones de Estado
    document.getElementById('readyBtn').onclick = () => {
        card3d.classList.add('active');
        document.getElementById('readyBtn').style.display = "none";
        document.getElementById('offBtn').style.display = "block";
        document.getElementById('downloadBtn').style.display = "block";
    };

    document.getElementById('offBtn').onclick = () => {
        card3d.classList.remove('active');
        card3d.style.transform = `rotateY(0deg) rotateX(0deg)`;
        document.getElementById('readyBtn').style.display = "block";
        document.getElementById('offBtn').style.display = "none";
    };

    // Subida y Descarga (Simplificada)
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
                img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                canvas.add(img); img.sendToBack(); canvas.renderAll();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('downloadBtn').onclick = async () => {
        // Lógica de descarga igual a la anterior
        alert("Generando y descargando...");
    };
</script>
</body>
</html>
