<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTweaks.club | Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-wrapper { display: flex; gap: 20px; align-items: flex-start; }
        .card { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .canvas-box { text-align: center; }
        canvas { border: 2px solid #eee; border-radius: 8px; background: #fff; }
        .controls-box { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .upload-btn, button#downloadBtn { background: #6c63ff; color: white; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; width: 100%; }
        .toggle-group { display: flex; align-items: center; gap: 10px; color: #555; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="card canvas-box">
            <canvas id="c" width="512" height="512"></canvas>
        </div>

        <div class="card controls-box">
            <h1>MCTweaks.club</h1>
            <input type="file" id="fileInput" accept="image/*" class="upload-btn">
            
            <div class="toggle-group">
                <input type="checkbox" id="clipToggle">
                <label for="clipToggle">Activar Modo Recorte</label>
            </div>

            <button id="downloadBtn">Descargar Overlay (.png)</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('c');
        let userImage = null;
        let template = null;

        fabric.Image.fromURL('inventory.png', function(img) {
            template = img;
            template.set({ selectable: false, evented: false, crossOrigin: 'anonymous' });
            canvas.add(template);
            canvas.requestRenderAll();
        }, { crossOrigin: 'anonymous' });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                fabric.Image.fromURL(event.target.result, function(img) {
                    if (userImage) canvas.remove(userImage);
                    userImage = img;
                    userImage.scaleToWidth(512);
                    userImage.center();
                    canvas.add(userImage);
                    updateClip(); // Aplicar lógica de recorte al cargar
                    canvas.requestRenderAll();
                });
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function updateClip() {
            if (!userImage) return;
            const isChecked = document.getElementById('clipToggle').checked;
            
            if (isChecked) {
                // Usamos el template como máscara
                userImage.clipPath = new fabric.Image(template.getElement(), {
                    originX: 'center', originY: 'center'
                });
            } else {
                userImage.clipPath = null;
            }
            canvas.requestRenderAll();
        }

        document.getElementById('clipToggle').addEventListener('change', updateClip);

        document.getElementById('downloadBtn').addEventListener('click', function() {
            canvas.discardActiveObject();
            const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 });
            const link = document.createElement('a');
            link.download = 'mctweaks_overlay.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
</html>
