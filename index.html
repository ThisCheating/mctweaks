<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks | Editor Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #6c63ff; --dark: #121212; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; }
        header { background: #1a1a1a; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .nav-links a { color: #ccc; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .app-wrapper { display: flex; gap: 40px; justify-content: center; padding: 40px; flex-wrap: wrap; }
        .scene { width: 512px; height: 512px; perspective: 1200px; }
        .card-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.05s linear; }
        .depth-layer { position:absolute; width:100%; height:100%; background:rgba(255,255,255,0.05); transform:translateZ(-40px); border-radius:12px; opacity:0; pointer-events:none; }
        .card-3d.active .depth-layer { opacity: 1; }
        canvas { background: transparent; border-radius: 12px; cursor: grab; }
        .controls { width: 400px; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; border-radius: 5px; padding: 8px; box-sizing: border-box; }
        .color-btn { width: 30px; height: 30px; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; margin: 2px; }
        .btn-main { background: var(--primary); color: white; padding: 12px; border: none; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color:var(--primary)">MCTweaks</h2>
    <nav class="nav-links"><a href="#">Tools</a><a href="#">Community</a><a href="#">Skins</a><a href="#">Renders</a></nav>
</header>

<div class="app-wrapper">
    <div class="scene">
        <div class="card-3d" id="card3d">
            <div class="depth-layer"></div>
            <canvas id="c" width="512" height="512"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Nombre del Pack</label>
            <input type="text" id="packName" placeholder="MiTexturePack">
        </div>
        <div class="control-group">
            <label>Descripción</label>
            <div id="palette" style="display:flex; flex-wrap:wrap; margin-bottom:5px;"></div>
            <textarea id="descInput" rows="2">§ePack de §aMCTweaks.club</textarea>
        </div>
        <div class="control-group">
            <label>Imagen de Fondo</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>Sound Mixer (.zip)</label>
            <input type="file" id="soundInput" accept=".zip">
        </div>
        <div class="control-group">
            <label>SkyOverlay Mixer (.zip)</label>
            <input type="file" id="skyInput" accept=".zip">
        </div>

        <button id="readyBtn" class="btn-main">Activar Modo 3D</button>
        <button id="offBtn" class="btn-main" style="background:#e74c3c; display:none;">Desactivar 3D</button>
        <button id="downloadBtn" class="btn-main" style="background:#2ecc71;">Generar .zip</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    canvas.selection = false;
    const card3d = document.getElementById('card3d');

    fabric.Image.fromURL('inventory.png', (img) => {
        img.set({ selectable: false, evented: false, originX: 'center', originY: 'center', left: 256, top: 256 });
        canvas.add(img);
    }, { crossOrigin: 'anonymous' });

    // Colores Minecraft
    const colors = [{c:'§0', b:'#000000'}, {c:'§1', b:'#0000AA'}, {c:'§2', b:'#00AA00'}, {c:'§4', b:'#AA0000'}, {c:'§6', b:'#FFAA00'}, {c:'§a', b:'#55FF55'}, {c:'§d', b:'#FF55FF'}, {c:'§f', b:'#FFFFFF'}];
    colors.forEach(col => {
        const b = document.createElement('button');
        b.className = 'color-btn'; b.innerText = 'A'; b.style.backgroundColor = col.b;
        b.onclick = () => document.getElementById('descInput').value += col.c;
        document.getElementById('palette').appendChild(b);
    });

    // Lógica 3D 360°
    let isDragging = false;
    canvas.on('mouse:down', () => { if(card3d.classList.contains('active')) isDragging = true; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let x = (e.clientX / window.innerWidth - 0.5) * 360;
        let y = (e.clientY / window.innerHeight - 0.5) * 360;
        card3d.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    document.getElementById('readyBtn').onclick = () => {
        canvas.discardActiveObject();
        canvas.forEachObject(o => o.selectable = false);
        card3d.classList.add('active');
        document.getElementById('readyBtn').style.display = 'none';
        document.getElementById('offBtn').style.display = 'block';
    };

    document.getElementById('offBtn').onclick = () => {
        canvas.forEachObject(o => o.selectable = true);
        card3d.classList.remove('active');
        card3d.style.transform = 'rotateY(0deg) rotateX(0deg)';
        document.getElementById('readyBtn').style.display = 'block';
        document.getElementById('offBtn').style.display = 'none';
    };

    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
                img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                canvas.add(img); img.sendToBack(); canvas.renderAll();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    };
</script>
</body>
</html>
