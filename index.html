<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks | Editor Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #6c63ff; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; }
        .app-wrapper { display: flex; gap: 20px; justify-content: center; padding: 20px; flex-wrap: wrap; }
        .scene { width: 512px; height: 512px; position: relative; }
        #c { background: transparent; border: 1px solid #333; border-radius: 8px; }
        .controls { width: 400px; background: var(--dark); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .file-list { max-height: 150px; overflow-y: auto; background: #000; padding: 10px; margin: 5px 0; font-size: 12px; }
        .btn-main { background: var(--primary); color: white; padding: 10px; border: none; cursor: pointer; width: 100%; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="scene">
        <canvas id="c" width="512" height="512"></canvas>
    </div>

    <div class="controls">
        <h3>Editor MCTweaks</h3>
        <input type="text" id="packName" placeholder="Nombre del Pack" style="width:100%; padding:5px; margin-bottom:10px;">
        
        <details>
            <summary>Selector de Sonidos (ZIP)</summary>
            <input type="file" id="soundInput" accept=".zip">
            <div id="soundList" class="file-list"></div>
        </details>

        <button id="downloadBtn" class="btn-main" style="background:#2ecc71;">Descargar Pack Completo</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    let zipFiles = { sounds: {} };

    // Leer ZIP y mostrar archivos para seleccionar
    document.getElementById('soundInput').onchange = async (e) => {
        const file = e.target.files[0];
        const zip = await JSZip.loadAsync(file);
        const list = document.getElementById('soundList');
        list.innerHTML = '';
        
        zip.forEach((relativePath, zipEntry) => {
            if (!zipEntry.dir) {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${relativePath}" checked> ${relativePath}<br>`;
                list.appendChild(label);
                zipFiles.sounds[relativePath] = zipEntry;
            }
        });
    };

    // Descarga corregida
    document.getElementById('downloadBtn').onclick = async () => {
        const zip = new JSZip();
        
        // 1. Añadir inventario
        zip.folder("assets/minecraft/textures/gui/container").file("inventory.png", canvas.toDataURL().split(',')[1], {base64: true});
        
        // 2. Añadir solo lo seleccionado
        const checkboxes = document.querySelectorAll('#soundList input:checked');
        for (let cb of checkboxes) {
            const content = await zipFiles.sounds[cb.value].async("blob");
            zip.file("assets/minecraft/sounds/" + cb.value, content);
        }

        const content = await zip.generateAsync({type: "blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = (document.getElementById('packName').value || "MCTweaks") + ".zip";
        a.click();
    };
</script>
</body>
</html>
