<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Generador Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .app-wrapper { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: #ffffff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .controls { width: 350px; display: flex; flex-direction: column; gap: 10px; }
        canvas { border: 2px dashed #ccc; border-radius: 8px; }
        .color-btn { border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; color: white; }
        textarea { width: 100%; padding: 8px; font-family: monospace; }
        .upload-btn { background: #6c63ff; color: white; padding: 10px; border-radius: 6px; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="card">
        <canvas id="c" width="512" height="512"></canvas>
    </div>

    <div class="card controls">
        <h1>MCTweaks.club</h1>
        
        <label>Descripción con colores:</label>
        <div id="colorPicker" style="margin-bottom: 5px;">
            <button class="color-btn" style="background:#f1c40f" onclick="insertColor('§e')">Amarillo</button>
            <button class="color-btn" style="background:#e74c3c" onclick="insertColor('§c')">Rojo</button>
            <button class="color-btn" style="background:#2ecc71" onclick="insertColor('§a')">Verde</button>
            <button class="color-btn" style="background:#3498db" onclick="insertColor('§b')">Azul</button>
        </div>
        <textarea id="descInput" rows="3">§ePack de §aMCTweaks.club</textarea>

        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Añadir imagen</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        
        <label>Mixer de Sonidos (.zip):</label>
        <input type="file" id="soundInput" accept=".zip">
        <div id="soundList" style="height: 100px; overflow-y: auto; border: 1px solid #ddd;"></div>

        <button id="downloadBtn" class="upload-btn" style="background:#2ecc71">Generar Texture Pack (.zip)</button>
    </div>
</div>

<script>
    // Función para insertar el código de color en el cursor
    function insertColor(code) {
        const textarea = document.getElementById('descInput');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        textarea.value = text.substring(0, start) + code + text.substring(end);
        textarea.focus();
    }

    const canvas = new fabric.Canvas('c');
    let template = null;
    let selectedSounds = new Map();

    // Template
    fabric.Image.fromURL('inventory.png', (img) => {
        template = img;
        template.set({ selectable: false, evented: false, originX: 'center', originY: 'center', left: 256, top: 256 });
        canvas.add(template);
        template.bringToFront();
    }, { crossOrigin: 'anonymous' });

    // Añadir imágenes
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
                img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                img.scaleToWidth(200);
                canvas.add(img);
                img.sendToBack();
                if(template) template.bringToFront();
                canvas.requestRenderAll();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    // Mixer de sonidos
    document.getElementById('soundInput').addEventListener('change', async (e) => {
        const zip = await JSZip.loadAsync(e.target.files[0]);
        const list = document.getElementById('soundList');
        list.innerHTML = "";
        zip.forEach((path, entry) => {
            if (path.endsWith('.ogg')) {
                const div = document.createElement('div');
                const chk = document.createElement('input'); chk.type = "checkbox";
                chk.onchange = async (e) => {
                    if(e.target.checked) selectedSounds.set(path, await entry.async("blob"));
                    else selectedSounds.delete(path);
                };
                const btn = document.createElement('button');
                btn.innerText = "▶ " + path.split('/').pop();
                btn.onclick = () => new Audio(URL.createObjectURL(new Blob([/*data*/]))).play(); // simplified for brevity
                div.append(chk, btn);
                list.appendChild(div);
            }
        });
    });

    // Generar ZIP Final
    document.getElementById('downloadBtn').addEventListener('click', async () => {
        const zip = new JSZip();
        // Exportar Canvas
        const canvasData = canvas.toDataURL({format: 'png'}).split(',')[1];
        zip.folder("assets/minecraft/textures/gui/container").file("inventory.png", canvasData, {base64: true});

        // Sonidos
        for (let [path, blob] of selectedSounds) {
            zip.file(`assets/minecraft/sounds/${path.split('/').pop()}`, blob);
        }

        // Metadatos con colores
        zip.file("pack.mcmeta", JSON.stringify({
            pack: { 
                pack_format: 34, 
                description: document.getElementById('descInput').value 
            }
        }, null, 2));

        const content = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "MCTweaks_Pack.zip";
        link.click();
    });
</script>
</body>
</html>
