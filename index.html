<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-wrapper { display: flex; gap: 20px; align-items: flex-start; }
        .card { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        canvas { border: 2px solid #ccc; background: #fff; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="card">
            <!-- Forzamos un borde y fondo para ver el lienzo sí o sí -->
            <canvas id="c" width="512" height="512" style="border: 2px dashed #6c63ff;"></canvas>
        </div>

        <div class="card">
            <h1>MCTweaks.club</h1>
            <input type="file" id="fileInput" accept="image/*">
            <button id="downloadBtn">Descargar</button>
            <p id="status" style="color:red; font-size: 12px;"></p>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('c');
        const status = document.getElementById('status');

        // Carga forzada con detección de errores
        fabric.Image.fromURL('inventory.png', function(img) {
            if (!img.getElement()) {
                status.innerText = "Error: No se encontró 'inventory.png'. Revisa el nombre del archivo.";
                return;
            }
            img.set({ selectable: false, evented: false });
            canvas.add(img);
            img.bringToFront();
            canvas.renderAll();
        }, { crossOrigin: 'anonymous' });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                fabric.Image.fromURL(event.target.result, function(img) {
                    img.scaleToWidth(512);
                    img.center();
                    canvas.add(img);
                    img.sendToBack();
                    canvas.renderAll();
                });
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const dataURL = canvas.toDataURL({ format: 'png' });
            const link = document.createElement('a');
            link.download = 'overlay.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
