<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MCTweaks.club | Generador 3D Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .app-wrapper { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: center; }
        
        .scene { width: 512px; height: 512px; perspective: 1500px; }
        .card-3d { 
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.05s linear; user-select: none; will-change: transform;
        }
        /* Cuando está activo, quitamos bordes de contenedor */
        .card-3d.active { cursor: grabbing; border: none; }
        
        /* Capa de grosor (solo se ve en 3D) */
        .depth-layer { 
            position: absolute; width: 100%; height: 100%; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); transform: translateZ(-40px); border-radius: 12px; pointer-events: none; opacity: 0;
        }
        .card-3d.active .depth-layer { opacity: 1; }

        #c { background: transparent; border-radius: 12px; cursor: grab; }
        
        .controls { width: 350px; background: #fff; color: #333; padding: 20px; border-radius: 15px; }
        .upload-btn { background: #6c63ff; color: white; padding: 10px; border-radius: 6px; border: none; cursor: pointer; width: 100%; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="scene">
        <div class="card-3d" id="card3d">
            <div class="depth-layer"></div>
            <canvas id="c" width="512" height="512"></canvas>
        </div>
    </div>

    <div class="controls">
        <h1>MCTweaks.club Editor</h1>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Subir Imagen Fondo</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button id="readyBtn" class="upload-btn" style="background:#f39c12">Activar Modo 3D</button>
        <button id="offBtn" class="upload-btn" style="background:#e74c3c; display:none">Desactivar 3D</button>
        <button id="downloadBtn" class="upload-btn" style="background:#2ecc71">Descargar Texture Pack</button>
    </div>
</div>

<script>
    const canvas = new fabric.Canvas('c');
    const card3d = document.getElementById('card3d');
    let isDragging = false;

    fabric.Image.fromURL('inventory.png', (img) => {
        img.set({ selectable: false, evented: false, originX: 'center', originY: 'center', left: 256, top: 256 });
        canvas.add(img);
    }, { crossOrigin: 'anonymous' });

    // Lógica 3D Sensible y 360°
    canvas.on('mouse:down', () => { if(card3d.classList.contains('active')) isDragging = true; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let x = (e.clientX / window.innerWidth - 0.5) * 360;
        let y = (e.clientY / window.innerHeight - 0.5) * 360;
        card3d.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    document.getElementById('readyBtn').onclick = () => {
        // 1. Desactivar selección de Fabric.js
        canvas.discardActiveObject();
        canvas.forEachObject(obj => { obj.selectable = false; obj.evented = false; });
        canvas.renderAll();
        
        // 2. Activar vista 3D limpia
        card3d.classList.add('active');
        document.getElementById('readyBtn').style.display = "none";
        document.getElementById('offBtn').style.display = "block";
    };

    document.getElementById('offBtn').onclick = () => {
        // 1. Reactivar selección
        canvas.forEachObject(obj => { obj.selectable = true; obj.evented = true; });
        
        // 2. Desactivar vista 3D
        card3d.classList.remove('active');
        card3d.style.transform = `rotateY(0deg) rotateX(0deg)`;
        document.getElementById('readyBtn').style.display = "block";
        document.getElementById('offBtn').style.display = "none";
    };

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
                img.set({ originX: 'center', originY: 'center', left: 256, top: 256 });
                canvas.add(img); img.sendToBack(); canvas.renderAll();
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    });
</script>
</body>
</html>
